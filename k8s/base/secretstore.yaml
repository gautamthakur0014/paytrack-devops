# =============================================================================
# FILE: k8s/base/secretstore.yaml
# OVERVIEW: Tells External Secrets Operator (ESO) HOW to reach AWS Secrets
# Manager. No credentials here: ESO's own service account has an IAM role
# (IRSA, created by Terraform), so nothing sensitive lives in Git.
# NOTE: change "region" if you deploy outside ap-south-1.

# This YAML defines a SecretStore resource in Kubernetes using the External Secrets Operator (ESO).
# Its job is to configure how ESO connects to AWS Secrets Manager.

# Remember the difference:

# SecretStore -	Configures connection to external secret provider
# ExternalSecret	- Specifies which external secrets to retrieve
# Secret	- Stores the retrieved values inside Kubernetes
# =============================================================================

# Namespaced store pointing at AWS Secrets Manager.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore 
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
