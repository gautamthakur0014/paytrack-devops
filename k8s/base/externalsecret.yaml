# =============================================================================
# FILE: k8s/base/externalsecret.yaml
# OVERVIEW: Declares "copy the JSON secret from AWS Secrets Manager into a
# normal Kubernetes Secret called server-secrets". Every JSON key (MONGO_URI,
# JWT_ACCESS_SECRET, ...) becomes an env var for the server pod.
# The secret NAME is patched per environment in k8s/overlays/*.

# This YAML defines an ExternalSecret resource in Kubernetes using the External Secrets Operator (ESO).
# Its main purpose is to fetch secrets stored in AWS Secrets Manager and automatically create/update a Kubernetes Secret.
# =============================================================================

# ESO reads the AWS secret and keeps the K8s Secret in sync (refresh hourly).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret  #Defines how to retrieve external secrets
metadata:
  name: server-secrets    # name of this resource not aws secret
spec: # tells ESO what it should do.
  refreshInterval: 1h
  secretStoreRef: # tells ESO which SecretStore configuration it should use.
    name: aws-secrets-manager #References another Kubernetes resource named aws-secrets-manager.
    kind: SecretStore #Tells ESO that the referenced resource is a SecretStore.
  target: #defines the Kubernetes Secret ESO should create.
    name: server-secrets  #name of the actual Kubernetes Secret that ESO will create.
    creationPolicy: Owner
  dataFrom: # tells ESO which AWS Secrets Manager secret to fetch and how to extract its contents.
    - extract:  #Used when you want to retrieve multiple key-value pairs from an external secret.
        key: REPLACED_BY_OVERLAY   #Specifies the name of the secret in AWS Secrets Manager. # e.g. paytrack/dev/server
