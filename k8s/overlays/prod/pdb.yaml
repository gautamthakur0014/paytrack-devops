# =============================================================================
# FILE: k8s/overlays/prod/pdb.yaml
# OVERVIEW: PodDisruptionBudget for PROD only: when nodes are drained
# (upgrades), Kubernetes must keep at least 1 API pod running.
# =============================================================================

# Guarantees availability of the API during voluntary disruptions.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: paytrack-server
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: paytrack-server }
