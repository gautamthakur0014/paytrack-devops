# =============================================================================
# FILE: client/nginx.conf
# OVERVIEW: nginx site config for the React SPA.
#   - SPA fallback (same idea as vercel.json rewrite): unknown paths -> index.html
#   - long cache for hashed assets, NO cache for index.html and sw.js
#   - /healthz endpoint for Kubernetes probes
# =============================================================================
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Gzip text assets (the JS bundle is ~1MB).
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Lightweight health endpoint used by liveness/readiness probes.
  location = /healthz {
    access_log off;
    return 200 "ok";
  }

  # Hashed build assets never change => cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Service worker must always be re-checked or users get stuck on old versions.
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback: React Router handles the path in the browser.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
